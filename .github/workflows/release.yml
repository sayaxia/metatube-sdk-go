name: Release (metatube-server-ltx)

# 每个 tag `v<MAJOR>.<MINOR>`（如 v4.1）产出：
#   - Linux amd64 / arm64 裸二进制包（tar.gz，含 LICENSE + VERSION）
#   - Linux amd64 / arm64 docker load 镜像包
#   - Windows x64 服务端 + 桌面面板
#   - docker-compose.yml / INSTALL.md / sha256
# 版本号规则见 scripts/version.sh 与 FORK.md「版本号与发版」一节。

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package (e.g. v4.1)'
        required: true

permissions:
  contents: write
  packages: write

jobs:

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      commit: ${{ steps.vars.outputs.commit }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve and verify version
        id: vars
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "${TAG}" ]; then TAG="${GITHUB_REF_NAME}"; fi
          # tag 必须两点式（v4.1），且与 VERSION 文件、notes/<ver>.md 自洽。
          bash scripts/version.sh verify "${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  image:
    name: Image (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            BUILD_TAGS=experimental
          tags: metatube-server-ltx:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export docker image
        run: |
          NAME="metatube-server-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}"
          docker save "metatube-server-ltx:${{ needs.prepare.outputs.tag }}" | gzip -9 > "${NAME}.tar.gz"
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          ls -lh "${NAME}.tar.gz"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: |
            metatube-server-*.tar.gz
            metatube-server-*.tar.gz.sha256
          if-no-files-found: error

  linux:
    name: Linux binary (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version-file: 'go.mod'

      - name: Build binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          module="github.com/metatube-community/metatube-sdk-go"
          base="-s -w -buildid= -X $module/internal/version.Version=$VERSION -X $module/internal/version.GitCommit=$COMMIT"
          mkdir -p dist pkg
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} go build -tags experimental -trimpath \
            -ldflags "$base" -o pkg/metatube-server ./cmd/server
          # VERSION 环境变量会让 -version 开关失效（见 cmd/server/main.go），必须清掉再跑。
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            env -u VERSION ./pkg/metatube-server -version
          fi
          cp LICENSE VERSION pkg/
          NAME="metatube-server-${VERSION}-linux-${{ matrix.arch }}-bin"
          tar -C pkg -czf "dist/${NAME}.tar.gz" metatube-server LICENSE VERSION
          sha256sum "dist/${NAME}.tar.gz" > "dist/${NAME}.tar.gz.sha256"
          file pkg/metatube-server
          ls -lh dist

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/metatube-server-*.tar.gz
            dist/metatube-server-*.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: Windows binaries
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version-file: 'go.mod'

      # windows-latest runner 会无日志卡死（实测 20+ 分钟），统一在 ubuntu 交叉编译。
      - name: Build Windows binaries (cross-compile)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          module="github.com/metatube-community/metatube-sdk-go"
          base="-s -w -buildid= -X $module/internal/version.Version=$VERSION -X $module/internal/version.GitCommit=$COMMIT"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags experimental -trimpath \
            -ldflags "$base" -o dist/metatube-server.exe ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags experimental -trimpath \
            -ldflags "$base -H windowsgui" -o dist/metatube-panel.exe ./cmd/panel
          file dist/metatube-server.exe dist/metatube-panel.exe
          ls -lh dist

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/metatube-*.exe
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [prepare, image, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Download amd64 image
        uses: actions/download-artifact@v4
        with:
          name: image-amd64
          path: dist

      - name: Download arm64 image
        uses: actions/download-artifact@v4
        with:
          name: image-arm64
          path: dist

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: linux-amd64
          path: dist

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64
          path: dist

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist

      - name: Generate compose, instructions and release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          IMAGE="ghcr.io/${OWNER}/metatube-server-ltx:${TAG}"
          ROUND="notes/${VERSION}.md"
          # 本轮更新说明必须单独存在，缺失即失败（防止把历史内容带进本版说明）。
          [ -f "${ROUND}" ] || { echo "missing ${ROUND}" >&2; exit 1; }

          cat > dist/docker-compose.yml <<EOF
          # metatube-server-ltx ${TAG}
          # version 为兼容 docker-compose v1（DSM 6、旧版 Linux）保留，compose v2 会忽略并提示 obsolete
          version: "3.8"

          services:
            metatube:
              image: ${IMAGE}
              container_name: metatube
              ports:
                - "8080:8080"
              restart: unless-stopped
              environment:
                - TZ=Asia/Shanghai
              volumes:
                - ./data:/data
              command: -dsn /data/metatube.db -port 8080
          EOF

          cat > dist/INSTALL.md <<EOF
          # metatube-server-ltx ${TAG} 安装说明

          ## 方式一：离线加载镜像包（内网 / DSM 6 推荐）

          \`\`\`bash
          # 1. 校验并导入（docker load 可直接读 .tar.gz；旧版本报错时用下一行）
          sha256sum -c metatube-server-${VERSION}-linux-amd64.tar.gz.sha256
          docker load -i metatube-server-${VERSION}-linux-amd64.tar.gz
          # gunzip -c metatube-server-${VERSION}-linux-amd64.tar.gz | docker load

          # 2. 运行（导入后的镜像名是 metatube-server-ltx:${TAG}）
          docker run -d --name metatube -p 8080:8080 \\
            -v metatube-data:/data \\
            metatube-server-ltx:${TAG} -dsn /data/metatube.db -port 8080
          \`\`\`

          ## 方式二：docker compose（在线拉取 GHCR）

          \`\`\`bash
          cd <本文件所在目录>
          docker compose up -d          # compose v2（Docker 20.10+ / DSM 7）
          docker-compose up -d          # compose v1（DSM 6 只能用这个）

          # 已有容器需要更新镜像时
          docker compose pull && docker compose up -d        # v2
          docker-compose pull && docker-compose up -d        # v1
          \`\`\`

          用离线包又想让 compose 跑起来：把 compose 里的 \`image\` 改成 \`metatube-server-ltx:${TAG}\`，
          之后不要再执行 \`pull\`。

          ## 方式三：直接拉取 GHCR 镜像（多架构）

          \`\`\`bash
          docker pull ${IMAGE}                 # 固定版本（${TAG}）
          docker pull ghcr.io/${OWNER}/metatube-server-ltx:latest   # 跟随最新发布
          docker run -d --name metatube -p 8080:8080 -v metatube-data:/data ${IMAGE}
          \`\`\`

          > 若 GHCR 包为私有，请先执行 \`docker login ghcr.io\`，或在 GitHub 的
          > Package settings 中把该包改为 Public。
          > 旧的 \`:ltx\` 标签自 v4.1 起停止更新，请改用 \`:latest\` 或固定版本号。

          ## 方式四：Linux 裸二进制（不装 Docker）

          \`\`\`bash
          tar -xzf metatube-server-${VERSION}-linux-amd64-bin.tar.gz
          ./metatube-server -version                       # 应显示 ${VERSION}
          ./metatube-server -dsn ./metatube.db -port 8080
          \`\`\`

          arm64 机器把文件名换成 \`-arm64-bin.tar.gz\`。二进制是静态编译（\`CGO_ENABLED=0\`），
          可直接在 DSM / 任意 Linux 上跑；首次运行会在同目录建 SQLite 库。

          ## 方式五：Windows 桌面版（无需 Docker）

          下载 \`metatube-server.exe\` 与 \`metatube-panel.exe\`，放在**同一目录**：
          - \`metatube-panel.exe\`：图形面板，双击启动，自动托管服务、可开关/重启，
            关闭窗口与最小化都进系统托盘（右键退出会一并关闭服务）。需要系统已装
            Edge WebView2 运行时（Win10/11 一般自带）。
          - \`metatube-server.exe\`：无界面的服务本体，也可单独命令行运行。

          首次启动后在面板设置里填后端地址与 access token 即可连接；
          翻译引擎凭据写入同目录 \`translate.json\`，或通过 \`MT_TRANSLATE_JSON\` 环境变量提供。
          浏览器打开 \`http://127.0.0.1:8080/ui\` 可访问内置控制台。

          ## DSM 6 / 群晖注意事项

          1. DSM 6 的 Docker 套件只带 **docker-compose v1**，没有 \`docker compose\` 子命令，命令必须用 \`docker-compose\`。
          2. compose v1 要求文件里有 \`version:\` 字段（本目录的 \`docker-compose.yml\` 已内置 \`version: "3.8"\`），否则会按 legacy 格式解析而报错。
          3. DSM 6 的「注册表」搜不到 ghcr.io，需 SSH 里 \`docker pull\`；或用「映像 → 新增 → 从文件添加」导入，**GUI 只认未压缩的 .tar**，先 \`gunzip -c x.tar.gz > x.tar\`。
          4. 容器名冲突（之前用 docker run 跑过）：先 \`docker rm -f metatube\` 再 compose up。
          5. compose 里的 \`./data\` 是相对路径，SSH 下务必先 \`cd\` 到 compose 所在目录；也可改成 \`/volume1/docker/metatube/data\`。
          6. 拉取时若报 TLS handshake timeout / x509，说明根证书或出网有问题，改用离线包最省事。
          7. armv7 机型（如 DS213j、DS115j）没有对应镜像，仅提供 amd64 / arm64。

          ## 验证

          \`\`\`bash
          docker exec metatube /metatube-server -version   # 应显示 ${VERSION}
          curl 'http://127.0.0.1:8080/v1/movies/search?q=ABP-030-LTX' | head -c 300
          \`\`\`

          本文件的版本号与分支差异说明见 \`FORK.md\`。
          EOF

          {
            echo "## metatube-server-ltx ${TAG}"
            echo
            echo "镜像标签 \`${TAG}\` 与 \`latest\`；旧的 \`:ltx\` 不再更新。"
            echo
            echo "### 本轮改动"
            echo
            cat "${ROUND}"
            echo
            echo "### 资产说明"
            echo "| 文件 | 说明 |"
            echo "| --- | --- |"
            echo "| \`metatube-server-${VERSION}-linux-amd64-bin.tar.gz\` | Linux amd64 裸二进制（解压即用） |"
            echo "| \`metatube-server-${VERSION}-linux-arm64-bin.tar.gz\` | Linux arm64 裸二进制 |"
            echo "| \`metatube-server-${VERSION}-linux-amd64.tar.gz\` | amd64 \`docker load\` 镜像包 |"
            echo "| \`metatube-server-${VERSION}-linux-arm64.tar.gz\` | arm64 \`docker load\` 镜像包 |"
            echo "| \`metatube-server.exe\` | Windows x64 服务端本体 |"
            echo "| \`metatube-panel.exe\` | Windows x64 桌面面板（含服务托管） |"
            echo "| \`docker-compose.yml\` | 开箱即用的 compose 文件 |"
            echo "| \`INSTALL.md\` | 安装与验证步骤 |"
            echo "| \`*.sha256\` | 校验文件 |"
            echo
            echo "GHCR: \`ghcr.io/${OWNER}/metatube-server-ltx:${TAG}\` / \`:latest\`"
            echo
            echo "构建日志：${RUN_URL}"
          } > dist/RELEASE_NOTES.md

          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: metatube-server-ltx ${{ needs.prepare.outputs.tag }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/metatube-server-*.tar.gz
            dist/metatube-server-*.tar.gz.sha256
            dist/metatube-server.exe
            dist/metatube-panel.exe
            dist/docker-compose.yml
            dist/INSTALL.md
          fail_on_unmatched_files: false

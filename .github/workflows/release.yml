name: Release Package (LTX Fork)

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package (e.g. v1.4.0-ltx.1)'
        required: true

permissions:
  contents: write
  packages: write

jobs:

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      commit: ${{ steps.vars.outputs.commit }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: vars
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "${TAG}" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  image:
    name: Image (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            BUILD_TAGS=experimental
          tags: metatube-server:${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export docker image
        run: |
          NAME="metatube-server-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}"
          docker save "metatube-server:${{ needs.prepare.outputs.version }}" | gzip -9 > "${NAME}.tar.gz"
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          ls -lh "${NAME}.tar.gz"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: |
            metatube-server-*.tar.gz
            metatube-server-*.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: Windows binaries
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          check-latest: true
          go-version-file: 'go.mod'

      - name: Build Windows binaries (cross-compile)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          module="github.com/metatube-community/metatube-sdk-go"
          base="-s -w -buildid= -X $module/internal/version.Version=$VERSION -X $module/internal/version.GitCommit=$COMMIT"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags experimental -trimpath \
            -ldflags "$base" -o dist/metatube-server.exe ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags experimental -trimpath \
            -ldflags "$base -H windowsgui" -o dist/metatube-panel.exe ./cmd/panel
          file dist/metatube-server.exe dist/metatube-panel.exe
          ls -lh dist

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: dist/metatube-*.exe
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [prepare, image, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download amd64 image
        uses: actions/download-artifact@v4
        with:
          name: image-amd64
          path: dist

      - name: Download arm64 image
        uses: actions/download-artifact@v4
        with:
          name: image-arm64
          path: dist

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: dist

      - name: Generate compose file and instructions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER}/metatube-server:${VERSION}"

          cat > dist/docker-compose.yml <<EOF
          # MetaTube Server (LTX fork) ${TAG}
          # version 为兼容 docker-compose v1（DSM 6、旧版 Linux）保留，compose v2 会忽略并提示 obsolete
          version: "3.8"

          services:
            metatube:
              image: ${IMAGE}
              container_name: metatube
              ports:
                - "8080:8080"
              restart: unless-stopped
              environment:
                - TZ=Asia/Shanghai
              volumes:
                - ./data:/data
              command: -dsn /data/metatube.db -port 8080
          EOF

          cat > dist/INSTALL.md <<EOF
          # MetaTube Server ${TAG} 安装说明

          ## 方式一：离线加载镜像包（内网 / DSM 6 推荐）

          \`\`\`bash
          # 1. 校验并导入（docker load 可直接读 .tar.gz；旧版本报错时用下一行）
          sha256sum -c metatube-server-${VERSION}-linux-amd64.tar.gz.sha256
          docker load -i metatube-server-${VERSION}-linux-amd64.tar.gz
          # gunzip -c metatube-server-${VERSION}-linux-amd64.tar.gz | docker load

          # 2. 运行（导入后的镜像名是 metatube-server:${VERSION}）
          docker run -d --name metatube -p 8080:8080 \\
            -v metatube-data:/data \\
            metatube-server:${VERSION} -dsn /data/metatube.db -port 8080
          \`\`\`

          ## 方式二：docker compose（在线拉取 GHCR）

          \`\`\`bash
          cd <本文件所在目录>
          docker compose up -d          # compose v2（Docker 20.10+ / DSM 7）
          docker-compose up -d          # compose v1（DSM 6 只能用这个）

          # 已有容器需要更新镜像时
          docker compose pull && docker compose up -d        # v2
          docker-compose pull && docker-compose up -d        # v1
          \`\`\`

          用离线包又想让 compose 跑起来，先打个别名，再把 compose 里的 image 改成同名：

          \`\`\`bash
          docker tag metatube-server:${VERSION} metatube-server:ltx
          # 之后 image: metatube-server:ltx，且不要再执行 pull
          \`\`\`

          ## 方式三：直接拉取 GHCR 镜像（多架构）

          \`\`\`bash
          docker pull ${IMAGE}
          docker run -d --name metatube -p 8080:8080 -v metatube-data:/data ${IMAGE}
          \`\`\`

          > 若 GHCR 包为私有，请先执行 \`docker login ghcr.io\`，或在 GitHub 的
          > Package settings 中把该包改为 Public。

          ## 方式四：Windows 桌面版（无需 Docker）

          下载 \`metatube-server.exe\` 与 \`metatube-panel.exe\`，放在**同一目录**：
          - \`metatube-panel.exe\`：图形面板，双击启动，自动托管服务、可开关/重启，
            关闭窗口与最小化都进系统托盘（右键退出会一并关闭服务）。需要系统已装
            Edge WebView2 运行时（Win10/11 一般自带）。
          - \`metatube-server.exe\`：无界面的服务本体，也可单独命令行运行。

          首次启动后在面板设置里填后端地址与 access token 即可连接；
          翻译引擎凭据写入同目录 \`translate.json\`，或通过 \`MT_TRANSLATE_JSON\` 环境变量提供。
          浏览器打开 \`http://127.0.0.1:8080/ui\` 可访问内置控制台。

          ## DSM 6 / 群晖注意事项

          1. DSM 6 的 Docker 套件只带 **docker-compose v1**，没有 \`docker compose\` 子命令，命令必须用 \`docker-compose\`。
          2. compose v1 要求文件里有 \`version:\` 字段（本目录的 \`docker-compose.yml\` 已内置 \`version: "3.8"\`），否则会按 legacy 格式解析而报错。
          3. DSM 6 的「注册表」搜不到 ghcr.io，需 SSH 里 \`docker pull\`；或用「映像 → 新增 → 从文件添加」导入，**GUI 只认未压缩的 .tar**，先 \`gunzip -c x.tar.gz > x.tar\`。
          4. 容器名冲突（之前用 docker run 跑过）：先 \`docker rm -f metatube\` 再 compose up。
          5. compose 里的 \`./data\` 是相对路径，SSH 下务必先 \`cd\` 到 compose 所在目录；也可改成 \`/volume1/docker/metatube/data\`。
          6. 拉取时若报 TLS handshake timeout / x509，说明根证书或出网有问题，改用离线包最省事。
          7. armv7 机型（如 DS213j、DS115j）没有对应镜像，仅提供 amd64 / arm64。

          ## 验证

          \`\`\`bash
          docker exec metatube /metatube-server -version   # 应显示 ${TAG}
          curl 'http://127.0.0.1:8080/v1/movies/search?q=ABP-030-LTX' | head -c 300
          \`\`\`

          本版本相对上游 v1.4.0 的改动见 \`FORK.md\`。
          EOF

          cat > dist/RELEASE_NOTES.md <<EOF
          ## MetaTube Server ${TAG}

          基于上游 [metatube-community/metatube-sdk-go](https://github.com/metatube-community/metatube-sdk-go) v1.4.0 的个人构建版本。

          ### 本版改动
          - **内置控制台 \`/ui\`**：总览显示最近搜索（同番号聚合成一行）、成功与否、来源与结果；
            点开有友好的详情弹窗；请求日志可按番号阅读、查询串里的密钥自动打码；支持一键清空。
          - **Windows 桌面面板 \`metatube-panel.exe\`**：WebView2 窗口 + 系统托盘，自动启动/停止/重启
            服务，关闭窗口与最小化都进托盘，右键退出会一并关服务；窗口与托盘使用官方 logo 图标，
            并设置进程 DPI 感知保证字体清晰。可与 \`metatube-server.exe\` 放同目录独立运行。
          - **出站代理**：默认跟随系统代理设置（Windows 读注册表、Linux/Docker 读环境变量），
            可用 \`MT_PROXY_URL\` 覆盖；同时修复 colly 系 provider 绕过代理导致抓空的问题。
          - **翻译**：新增百度大模型引擎 \`baiduai\`；翻译引擎凭据改由可执行文件同目录
            \`translate.json\` 或 \`MT_TRANSLATE_JSON\` 环境变量提供（容器无需挂 volume），
            支持热重载；控制台提供自动翻译开关与批量翻译接口 \`/v1/translate/batch\`。
          - **番号归一化**：检索前循环剥离 AI 修复 / 去水印工具尾部标记 \`ltx\`、\`restored\`、
            \`basicvsr++\`、\`wm\` 及原有后缀，叠加顺序无关，归一化为裸番号后再查。
          - 镜像以 \`-tags experimental\` 构建，编入实验池 provider；启用上述控制台新接口。

          ### 资产说明
          | 文件 | 说明 |
          | --- | --- |
          | \`metatube-server-${VERSION}-linux-amd64.tar.gz\` | amd64 \`docker load\` 镜像包 |
          | \`metatube-server-${VERSION}-linux-arm64.tar.gz\` | arm64 \`docker load\` 镜像包 |
          | \`metatube-server.exe\` | Windows 服务端本体 |
          | \`metatube-panel.exe\` | Windows 桌面面板（含服务托管） |
          | \`docker-compose.yml\` | 开箱即用的 compose 文件 |
          | \`INSTALL.md\` | 安装与验证步骤 |
          | \`*.sha256\` | 校验文件 |

          GHCR: \`${IMAGE}\`

          构建日志：${RUN_URL}
          EOF

          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: MetaTube Server ${{ needs.prepare.outputs.tag }} (LTX Fork)
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/metatube-server-*.tar.gz
            dist/metatube-server-*.tar.gz.sha256
            dist/metatube-server.exe
            dist/metatube-panel.exe
            dist/docker-compose.yml
            dist/INSTALL.md
          fail_on_unmatched_files: false

name: Release Docker Package (LTX Fork)

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to package (e.g. v1.4.0-ltx.1)'
        required: true

permissions:
  contents: write
  packages: write

jobs:

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: vars
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "${TAG}" ]; then TAG="${GITHUB_REF_NAME}"; fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  image:
    name: Image (${{ matrix.arch }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_TAGS=experimental
          tags: metatube-server:${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export docker image
        run: |
          NAME="metatube-server-${{ needs.prepare.outputs.version }}-linux-${{ matrix.arch }}"
          docker save "metatube-server:${{ needs.prepare.outputs.version }}" | gzip -9 > "${NAME}.tar.gz"
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          ls -lh "${NAME}.tar.gz"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: |
            metatube-server-*.tar.gz
            metatube-server-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [prepare, image]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Download amd64 image
        uses: actions/download-artifact@v4
        with:
          name: image-amd64
          path: dist

      - name: Download arm64 image
        uses: actions/download-artifact@v4
        with:
          name: image-arm64
          path: dist

      - name: Generate compose file and instructions
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${OWNER}/metatube-server:${VERSION}"

          cat > dist/docker-compose.yml <<EOF
          # MetaTube Server (LTX fork) ${TAG}
          # version 为兼容 docker-compose v1（DSM 6、旧版 Linux）保留，compose v2 会忽略并提示 obsolete
          version: "3.8"

          services:
            metatube:
              image: ${IMAGE}
              container_name: metatube
              ports:
                - "8080:8080"
              restart: unless-stopped
              environment:
                - TZ=Asia/Shanghai
              volumes:
                - ./data:/data
              command: -dsn /data/metatube.db -port 8080
          EOF

          cat > dist/INSTALL.md <<EOF
          # MetaTube Server ${TAG} 安装说明

          ## 方式一：离线加载镜像包（内网 / DSM 6 推荐）

          \`\`\`bash
          # 1. 校验并导入（docker load 可直接读 .tar.gz；旧版本报错时用下一行）
          sha256sum -c metatube-server-${VERSION}-linux-amd64.tar.gz.sha256
          docker load -i metatube-server-${VERSION}-linux-amd64.tar.gz
          # gunzip -c metatube-server-${VERSION}-linux-amd64.tar.gz | docker load

          # 2. 运行（导入后的镜像名是 metatube-server:${VERSION}）
          docker run -d --name metatube -p 8080:8080 \\
            -v metatube-data:/data \\
            metatube-server:${VERSION} -dsn /data/metatube.db -port 8080
          \`\`\`

          ## 方式二：docker compose（在线拉取 GHCR）

          \`\`\`bash
          cd <本文件所在目录>
          docker compose up -d          # compose v2（Docker 20.10+ / DSM 7）
          docker-compose up -d          # compose v1（DSM 6 只能用这个）

          # 已有容器需要更新镜像时
          docker compose pull && docker compose up -d        # v2
          docker-compose pull && docker-compose up -d        # v1
          \`\`\`

          用离线包又想让 compose 跑起来，先打个别名，再把 compose 里的 image 改成同名：

          \`\`\`bash
          docker tag metatube-server:${VERSION} metatube-server:ltx
          # 之后 image: metatube-server:ltx，且不要再执行 pull
          \`\`\`

          ## 方式三：直接拉取 GHCR 镜像（多架构）

          \`\`\`bash
          docker pull ${IMAGE}
          docker run -d --name metatube -p 8080:8080 -v metatube-data:/data ${IMAGE}
          \`\`\`

          > 若 GHCR 包为私有，请先执行 \`docker login ghcr.io\`，或在 GitHub 的
          > Package settings 中把该包改为 Public。

          ## DSM 6 / 群晖注意事项

          1. DSM 6 的 Docker 套件只带 **docker-compose v1**，没有 \`docker compose\` 子命令，命令必须用 \`docker-compose\`。
          2. compose v1 要求文件里有 \`version:\` 字段（本目录的 \`docker-compose.yml\` 已内置 \`version: "3.8"\`），否则会按 legacy 格式解析而报错。
          3. DSM 6 的「注册表」搜不到 ghcr.io，需 SSH 里 \`docker pull\`；或用「映像 → 新增 → 从文件添加」导入，**GUI 只认未压缩的 .tar**，先 \`gunzip -c x.tar.gz > x.tar\`。
          4. 容器名冲突（之前用 docker run 跑过）：先 \`docker rm -f metatube\` 再 compose up。
          5. compose 里的 \`./data\` 是相对路径，SSH 下务必先 \`cd\` 到 compose 所在目录；也可改成 \`/volume1/docker/metatube/data\`。
          6. 拉取时若报 TLS handshake timeout / x509，说明根证书或出网有问题，改用离线包最省事。
          7. armv7 机型（如 DS213j、DS115j）没有对应镜像，仅提供 amd64 / arm64。

          ## 验证

          \`\`\`bash
          docker exec metatube /metatube-server -version   # 应显示 ${TAG}
          curl 'http://127.0.0.1:8080/v1/movies/search?q=ABP-030-LTX' | head -c 300
          \`\`\`

          本版本相对上游 v1.4.0 的改动见 \`FORK.md\`。
          EOF

          cat > dist/RELEASE_NOTES.md <<EOF
          ## MetaTube Server ${TAG}

          基于上游 [metatube-community/metatube-sdk-go](https://github.com/metatube-community/metatube-sdk-go) v1.4.0 的个人构建版本。

          ### 本版改动
          - 修复 AI 马赛克修复工具（Jasna / LTX 模型）追加的 \`-LTX\` 后缀导致番号无法匹配的问题：
          \`ABP-030-LTX\` / \`ABP-030_LTX\` / \`ABP-030-LTX-C\` 现在都会归一化为 \`ABP-030\` 后再检索。
          - 镜像改为以 \`-tags experimental\` 构建，编入实验池 provider（\`AVBASE\` / \`ThePornDB\` / \`AV-LEAGUE\`）。
          引用 \`AVBASE\` 的旧条目此前刷新会报 \`404 provider not found\`（刷新瞬间结束、元数据不变），本版已恢复。
          \`/v1/providers\` 应为 movie 34 / actor 3；\`MadouQu\` 因 \`Priority = 0\` 仍停用，属预期。

          ### 资产说明
          | 文件 | 说明 |
          | --- | --- |
          | \`metatube-server-${VERSION}-linux-amd64.tar.gz\` | amd64 \`docker load\` 镜像包 |
          | \`metatube-server-${VERSION}-linux-arm64.tar.gz\` | arm64 \`docker load\` 镜像包 |
          | \`docker-compose.yml\` | 开箱即用的 compose 文件 |
          | \`INSTALL.md\` | 安装与验证步骤 |
          | \`*.sha256\` | 校验文件 |

          GHCR: \`${IMAGE}\`

          构建日志：${RUN_URL}
          EOF

          ls -lh dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: MetaTube Server ${{ needs.prepare.outputs.tag }} (LTX Fork)
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/metatube-server-*.tar.gz
            dist/metatube-server-*.tar.gz.sha256
            dist/docker-compose.yml
            dist/INSTALL.md
          fail_on_unmatched_files: false
